<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="999" height="289" rx="18" fill="#14111a" stroke="#5a1525"/>
<rect x="0" y="32" width="8" height="226" rx="4" fill="#C8102E"/>
<text x="48" y="124" fill="#f3ecee" font-size="50" font-family="Georgia, 'Times New Roman', Times, serif">Eight exams. Twenty-five days.</text>
<text x="48" y="190" fill="#F0566A" font-size="50" font-family="Georgia, 'Times New Roman', Times, serif">Too much for one head.</text>
<text x="48" y="256" fill="#f3ecee" font-size="50" font-family="Georgia, 'Times New Roman', Times, serif">So I planned it first.</text>
</svg>
