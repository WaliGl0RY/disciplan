<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400">
<rect x="0.5" y="0.5" width="779" height="399" rx="22" fill="#16161a" stroke="#2c2c33"/>
<rect x="0" y="40" width="6" height="320" rx="3" fill="#e08858"/>
<text x="30" y="150" font-family="Georgia, 'Times New Roman', Times, serif" font-size="190" fill="#e08858" opacity=".18">“</text>
<text x="390" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="60" font-style="italic" fill="#e08858">I was behind.</text>
<text x="390" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#e9e8e3">Every exam phase started with the exams I still owed.</text>
<text x="390" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#e9e8e3">So at the end of July I started building a plan,</text>
<text x="390" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#e9e8e3">and on 4 August I started studying with it.</text>
<line x1="350" y1="282" x2="430" y2="282" stroke="#e08858" stroke-width="2" opacity=".6"/>
<text x="390" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="31" font-style="italic" fill="#e08858">I kept adapting it and judging what I had built,</text>
<text x="390" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="31" font-style="italic" fill="#e08858">again and again, until the last exam.</text>
</svg>